<style>
        body {
            background-color: #fff8f3;
            color: #1e1b17;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        .floating-blob {
            position: absolute;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.15;
            animation: float 20s infinite alternate ease-in-out;
        }
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 60px) scale(1.2); }
        }
        .reveal-content {
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="font-ui-body text-ui-body overflow-hidden">
<!-- Atmospheric Background Layers -->
<div class="fixed inset-0 pointer-events-none overflow-hidden">
<div class="floating-blob bg-primary w-96 h-96 top-[-10%] left-[-10%]"></div>
<div class="floating-blob bg-primary-container w-[500px] h-[500px] bottom-[-20%] right-[-10%]" style="animation-delay: -5s;"></div>
</div>
<!-- Top App Bar -->
<header class="w-full top-0 sticky bg-surface dark:bg-on-background flex items-center justify-between px-edge-margin h-16 w-full z-40 transition-opacity">
<div class="flex items-center gap-4">
<button class="hover:opacity-80 transition-opacity active:scale-95 transition-transform text-primary dark:text-primary-fixed-dim">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">EWJ Reader</h1>
</div>
<button class="hover:opacity-80 transition-opacity active:scale-95 transition-transform text-primary dark:text-primary-fixed-dim">
<span class="material-symbols-outlined">search</span>
</button>
</header>
<!-- Main Canvas -->
<main class="flex flex-col items-center justify-center min-h-[calc(100vh-128px)] px-edge-margin relative z-10">
<div class="reveal-content max-w-md w-full text-center space-y-lg">
<!-- Logo / Illustration Container -->
<div class="relative mx-auto w-48 h-48 flex items-center justify-center">
<!-- Decorative Circle -->
<div class="absolute inset-0 bg-surface-container rounded-full scale-110 opacity-50 blur-xl"></div>
<img alt="EWJ Document Reader Logo" class="relative z-10 w-40 h-40 object-contain drop-shadow-xl animate-pulse" src="https://lh3.googleusercontent.com/aida-public/AB6AXuArXb7x50GbfIPQx25rJVOTAUNes7_BI_m0S2Rpo6qMf7u0n6Xs4kx__zXAN8-kkQayneshszyVImUk-hrOkm3w0I68le7gKK6230mKVyGiSmjkOMziP7dpqAwO2-AxhExIIVJwIpl-6qne48PahL_umnXjMVdpBdNIaxBFGj1tJxqI-o4P4lfMW6B8tGlHonYBi4OK0HBfFRPUZ6MViYK_HhNmT7Ic_pRylJpr7dF5nDm6d57ACnPq" style="animation-duration: 4s;"/>
</div>
<!-- Empty State Typography -->
<div class="space-y-sm">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-background">Your library is empty</h2>
<p class="font-ui-body text-ui-body text-on-surface-variant max-w-[320px] mx-auto opacity-90">
                    Import your first PDF to start listening. Everything stays private on your device.
                </p>
</div>
<!-- Primary Action -->
<div class="pt-base">
<button class="bg-primary text-on-primary font-bold text-headline-md px-10 py-5 rounded-full shadow-lg shadow-primary/20 hover:shadow-primary/40 hover:opacity-90 active:scale-95 transition-all w-full md:w-auto">
                    Import PDF
                </button>
</div>
<!-- Subtle Trust Indicator -->
<div class="flex items-center justify-center gap-2 pt-md opacity-60">
<span class="material-symbols-outlined text-[18px]">lock</span>
<span class="text-label-sm font-label-sm tracking-wider uppercase">Local Processing Only</span>
</div>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-3 pb-safe bg-surface-container dark:bg-inverse-surface shadow-sm">
<!-- Library (Active) -->
<a class="flex flex-col items-center justify-center bg-primary-container dark:bg-on-primary-fixed-variant text-on-primary-container dark:text-primary-fixed rounded-full px-5 py-1 transition-transform duration-200 active:scale-90" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">library_books</span>
<span class="font-label-sm text-label-sm mt-1">Library</span>
</a>
<!-- Player (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-secondary-fixed-variant px-5 py-1 hover:bg-surface-variant dark:hover:bg-on-surface-variant transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined">play_circle</span>
<span class="font-label-sm text-label-sm mt-1">Player</span>
</a>
<!-- Settings (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-secondary-fixed-variant px-5 py-1 hover:bg-surface-variant dark:hover:bg-on-surface-variant transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined">settings</span>
<span class="font-label-sm text-label-sm mt-1">Settings</span>
</a>
</nav>
<script>
        // Simple micro-interaction for the import button
        const importBtn = document.querySelector('button.bg-primary');
        importBtn.addEventListener('click', () => {
            // Simulate a file picker or feedback
            importBtn.innerHTML = '<span class="flex items-center gap-2"><svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Searching...</span>';
            setTimeout(() => {
                importBtn.innerText = 'Import PDF';
            }, 2000);
        });

        // Background parallax effect
        document.addEventListener('mousemove', (e) => {
            const blobs = document.querySelectorAll('.floating-blob');
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            blobs.forEach((blob, index) => {
                const speed = (index + 1) * 20;
                blob.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
            });
        });
    </script>
</body></html>
